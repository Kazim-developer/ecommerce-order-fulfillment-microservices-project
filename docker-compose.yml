services:
  order-service:
    build:
      context: ./order-service
    ports:
      - "3002:3002"
    volumes:
      - ./order-service:/app
    environment:
      PORT: 3002
      DATABASE_URL: "postgresql://postgres:786%26%2A%5EKazim@postgres:5432/orders_db?schema=public"

  inventory-service:
    build:
      context: ./inventory-service
    ports:
      - "3001:3001"
    volumes:
      - ./inventory-service:/app
    environment:
      PORT: 3001
      DATABASE_URL: "postgresql://app_user:786%26%2A%5EKazim@postgres:5432/inventory_db?schema=public"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  rabbitmq_data:
